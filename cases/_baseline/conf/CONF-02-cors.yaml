id: CONF-02
title: CORS 无反射 + 不携带凭据
layer: baseline
category: conf
endpoint: <BASE>
method: GET
auth: none
sign_layer: false
mutating: false
params: {}
headers_extra:
  Origin: https://evil.example.com
expected_safe:
